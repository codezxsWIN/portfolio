<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15101f">
  <title>Akshay Damle / Two-minute live walkthrough</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%235b16e0'/%3E%3Cpath fill='%23d4ff3d' d='M9 6l9 6-9 6z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../assets/css/fonts.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #15101f; color: #f4f2fa; font: 400 16px/1.5 'Archivo', system-ui, sans-serif; }
    main { max-width: 1640px; margin: 0 auto; padding: 32px clamp(18px, 4vw, 60px) 28px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    .label { margin: 0 0 5px; color: #d4ff3d; font: 400 11px/1.5 'Geist Mono', monospace; text-transform: uppercase; letter-spacing: .1em; }
    h1 { margin: 0; font-size: clamp(26px, 3vw, 40px); font-weight: 400; font-stretch: 80%; line-height: 1.1; }
    a { color: inherit; text-underline-offset: 4px; }
    a:hover { color: #d4ff3d; }
    :focus-visible { outline: 2px solid #d4ff3d; outline-offset: 5px; }
    .live-site { flex: none; padding: 10px 15px; border: 1px solid #f4f2fa55; border-radius: 3px; font-size: 13px; text-decoration: none; }
    .screen { overflow: hidden; background: #09060f; border: 1px solid #f4f2fa33; border-radius: 6px; box-shadow: 0 18px 65px #0005; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #09060f; }
    .details { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 16px 32px; margin-top: 20px; }
    .details p { margin: 0; }
    .meta { color: #f4f2fa99; font: 400 11px/1.7 'Geist Mono', monospace; }
    .description { margin-top: 5px !important; color: #f4f2fabb; font-size: 13px; }
    .links { display: flex; flex-wrap: wrap; gap: 18px; font-size: 13px; }
    #playback-error { margin: 16px 0 0; padding: 12px 16px; border-left: 3px solid #d4ff3d; background: #f4f2fa0d; }
    @media (max-width: 600px) { main { padding-top: 22px; } header { align-items: flex-start; } .live-site { font-size: 11px; padding: 8px 10px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="label">Akshay Damle / Portfolio 2026</p>
        <h1>Two-minute site walkthrough</h1>
      </div>
      <a class="live-site" href="../index.html">Open the live site</a>
    </header>
    <div class="screen">
      <video id="walkthrough" controls autoplay muted playsinline preload="metadata" aria-label="Two-minute live desktop and mobile walkthrough of Akshay Damle's portfolio">
        <source src="site-walkthrough-2min.mp4" type="video/mp4">
        Your browser does not support embedded video. <a href="site-walkthrough-2min.mp4" download>Download the recording</a>.
      </video>
    </div>
    <div class="details">
      <div>
        <p class="meta">2:00 / 1920 x 1080 / Desktop + touch-enabled mobile / 20 chapters</p>
        <p class="description">A concise edit of real browser motion and interactions, not screenshots. Silent, with on-screen captions.</p>
      </div>
      <nav class="links" aria-label="Recording files">
        <a href="site-walkthrough-2min.mp4" download>Download MP4</a>
        <a href="walkthrough-chapters.txt">Chapter guide</a>
      </nav>
    </div>
    <p id="playback-error" role="status" hidden></p>
  </main>
  <script>
    const video = document.getElementById('walkthrough');
    video.addEventListener('error', () => {
      const message = document.getElementById('playback-error');
      message.hidden = false;
      message.textContent = 'This browser could not play the MP4 recording. Use Download MP4 to watch it in your video player.';
    });
  </script>
</body>
</html>
